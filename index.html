<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>家里都好</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✉️</text></svg>">
<style>
  :root{--paper:#f4efe4;--ink:#2b2620;--mut:#7a7264;--line:#c9bda3;--accent:#8a3b2c}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{background:var(--paper);color:var(--ink);font-family:'Noto Serif SC','Songti SC',STSong,SimSun,serif;
    min-height:100vh;line-height:1.9}
  .wrap{max-width:560px;margin:0 auto;padding:18px 18px 60px}

  /* ===== 标题页 ===== */
  #title{min-height:92vh;display:flex;flex-direction:column;justify-content:center;text-align:center}
  #title h1{font-size:52px;letter-spacing:14px;margin-left:14px;font-weight:900}
  #title .sub{color:var(--mut);font-size:14px;margin-top:14px;letter-spacing:3px}
  #title .rule{width:44px;height:1px;background:var(--line);margin:30px auto}
  #title .btns{display:flex;flex-direction:column;gap:12px;align-items:center;margin-top:8px}
  .tbtn{background:none;border:1px solid var(--ink);color:var(--ink);font-family:inherit;
    font-size:16px;padding:10px 44px;cursor:pointer;letter-spacing:6px;margin-left:6px}
  .tbtn:active{background:var(--ink);color:var(--paper)}
  #title .note{color:var(--mut);font-size:11px;margin-top:34px;line-height:1.8}

  /* ===== 游戏页 ===== */
  #game{display:none}
  .top{border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:18px}
  .date{font-size:14px;letter-spacing:2px}
  .date b{font-weight:900}
  .stat{display:flex;gap:14px;margin-top:6px;font-size:12px;color:var(--mut);flex-wrap:wrap}
  .stat span b{color:var(--ink);font-weight:600}
  .story p{margin-bottom:16px;text-indent:2em}
  .choices{margin-top:26px;display:flex;flex-direction:column;gap:10px}
  .choice{background:none;border:1px solid #a89a7e;color:var(--ink);font-family:inherit;font-size:15px;
    padding:11px 16px;text-align:left;cursor:pointer;line-height:1.6}
  .choice:active{background:var(--ink);color:var(--paper)}
  .dayend{border:1px solid var(--line);padding:18px 18px;margin-top:26px;background:#efe9db}
  .dayend h3{font-size:15px;letter-spacing:4px;margin-bottom:10px}
  .dayend ul{list-style:none;font-size:13px;color:#57503f}
  .dayend li{margin-bottom:4px}
  .dayend li:before{content:'□ ';}
  .dayend li.done:before{content:'■ ';color:var(--accent)}
  .dayend .next{margin-top:12px;color:var(--mut);font-size:12px;letter-spacing:2px}
  .fx-tip{font-size:12px;color:var(--mut);margin-bottom:18px;letter-spacing:1px}

  /* ===== 玩家选择 ===== */
  #picker{display:none;min-height:60vh;padding-top:8vh}
  #picker h2{font-size:20px;letter-spacing:6px;font-weight:900;text-align:center;margin-bottom:6px}
  #picker .psub{color:var(--mut);font-size:12px;text-align:center;letter-spacing:2px;margin-bottom:26px}
  .plist{display:flex;flex-direction:column;gap:10px;max-width:360px;margin:0 auto}
  .pitem{background:none;border:1px solid #a89a7e;padding:12px 16px;cursor:pointer;text-align:left;font-family:inherit;color:var(--ink);font-size:15px;width:100%}
  .pitem:active{background:var(--ink);color:var(--paper)}
  .pitem .pn{font-weight:600;letter-spacing:2px}
  .pitem .pm{font-size:12px;color:var(--mut);margin-top:2px}
  .pitem:active .pm{color:var(--paper)}
  .pnew{border-style:dashed;color:var(--mut);text-align:center}
  #picker .foot{text-align:center;margin-top:30px;font-size:11px;color:var(--mut)}
  #picker .foot a{color:var(--mut);cursor:pointer;text-decoration:underline}
  /* ===== 提示条/配置弹窗 ===== */
  #cfgbar{background:#efe9db;border:1px solid var(--line);color:var(--mut);font-size:12px;padding:7px 10px;text-align:center;cursor:pointer;margin-bottom:6px;letter-spacing:1px;line-height:1.7}
  #cmodal{display:none;position:fixed;inset:0;background:rgba(43,38,32,.45);z-index:9;align-items:center;justify-content:center;padding:20px}
  #cbox{background:var(--paper);border:1px solid var(--ink);padding:22px 20px;max-width:400px;width:100%}
  #cbox h3{font-size:15px;letter-spacing:3px;margin-bottom:10px}
  #cbox p{font-size:12px;color:var(--mut);line-height:1.8;margin-bottom:10px}
  #cbox textarea{width:100%;border:1px solid #a89a7e;background:none;font-family:inherit;font-size:12px;padding:9px 10px;margin-bottom:10px;height:84px;resize:vertical;line-height:1.6}
  #cbox .row{display:flex;gap:10px}
  #cbox button{flex:1;background:none;border:1px solid var(--ink);color:var(--ink);font-family:inherit;font-size:13px;padding:9px;cursor:pointer;letter-spacing:2px}
  #cbox .msg{font-size:12px;margin-top:8px;color:var(--mut);min-height:18px;line-height:1.7}
  .who{font-size:11px;color:var(--mut);margin-top:5px;letter-spacing:1px}
  .who a{cursor:pointer;text-decoration:underline}

  /* ===== 风闻墙 ===== */
  .fw-mask{position:fixed;inset:0;background:rgba(20,16,10,.55);z-index:90;display:none;align-items:center;justify-content:center;padding:18px}
  .fw-mask.on{display:flex}
  .fw-box{background:#f3ecd8;color:#3a2f1e;max-width:420px;width:100%;max-height:78vh;overflow-y:auto;
    padding:22px 20px 18px;border:1px solid #c9b98d;box-shadow:0 8px 30px rgba(0,0,0,.35);font-family:"Noto Serif SC",serif}
  .fw-title{font-size:13px;letter-spacing:3px;color:#8a7448;margin-bottom:12px;border-bottom:1px solid #d8caa4;padding-bottom:8px}
  .fw-text{font-size:15px;line-height:2;min-height:120px;white-space:pre-wrap;word-break:break-all}
  .fw-text .cur{border-right:6px solid #8a7448;animation:blink .9s steps(1) infinite}
  @keyframes blink{50%{border-color:transparent}}
  .fw-foot{margin-top:16px;display:flex;gap:10px;justify-content:space-between;align-items:center;border-top:1px solid #d8caa4;padding-top:10px}
  .fw-foot a{color:#8a7448;font-size:13px;cursor:pointer;text-decoration:underline}
  .fw-wait{color:#a08c5e;font-size:13px}
  .fw-note{font-size:12px;color:#a08c5e;margin-top:8px}
</style>
</head>
<body>
<div class="wrap">

  <div id="cfgbar" style="display:none" onclick="openCfg()">未配云端令牌——进度只存本机，换设备带不走。<br>点这里配置，多人各存各的，云端同步。</div>

  <div id="title">
    <h1>家里都好</h1>
    <div class="sub">一九九五年 · 豫北县城 · 代写书信摊</div>
    <div class="rule"></div>
    <div class="btns">
      <button class="tbtn" id="btnEnter" style="display:none">进 摊</button>
    </div>
    <div class="note">你替全城人写"家里都好"。<br>你自己的那封，压了三个月零五天。<br><br>生活没有读档，这场里也没有。</div>
  </div>

  <div id="game">
    <div class="top">
      <div class="date" id="gDate"></div>
      <div class="stat" id="gStat"></div>
      <div class="who">执笔：<b id="gPlayer"></b> · <a onclick="switchPlayer()">换人</a> <span id="cloudDot"></span></div>
    </div>
    <div class="story" id="gText"></div>
    <div class="choices" id="gChoices"></div>
  </div>

  <div id="picker">
    <h2>谁 在 写</h2>
    <div class="psub">各写各的，进度互不相扰。</div>
    <div class="plist" id="pList"></div>
    <div class="foot"><a onclick="openCfg()">云端设置</a></div>
  </div>

</div>

<div id="cmodal">
  <div id="cbox">
    <h3>云 端 设 置</h3>
    <p>贴一个 GitHub 令牌（fine-grained，需包含本仓库 jialiandouhao 的 Contents 读写权限）。<br>
    配好后：每人一个存档，云端同步，换设备接着写。<br>不配置也能玩——进度只存本机。</p>
    <textarea id="tokIn" placeholder="github_pat_ 开头的令牌贴这里"></textarea>
    <div class="row">
      <button onclick="saveCfg()">存 并 试 连</button>
      <button onclick="closeCfg()">关 闭</button>
    </div>
    <div class="msg" id="cfgMsg"></div>
  </div>
</div>
<script>
/* ================= 场景数据 ================= */
/* 第6天起。第1-5天是"已经发生过的事"。 */
const DAY={num:6,date:'1995年4月1日',week:'周六',weather:'晴，风软'};
const DAY7={num:7,date:'1995年4月2日',week:'周日',weather:'晴，风软'};

const SCENES={
'd6_wake':{
  text:[
    '四月一号，周六。醒得比牙疼那几天晚。',
    '东屋的咳又起来了。两声，停了。水缸是满的——他挑惯了，院里有自来水也挑。',
    '今天月初。葡萄架底下那两声咳嗽，往年这个点该来了。听见那两声，就知道：该交房钱了。',
    '你摸了摸枕头边上的钱。一块九毛五。'
  ],
  choices:[
    {t:'过去东屋，问一声',go:'d6_ask',fx:{rel_gao:1}},
    {t:'先出摊',go:'d6_street'}
  ]
},
'd6_ask':{
  text:[
    '东屋门开着条缝。他坐在床沿上穿袜子，看见你，先开的口：',
    '"耳朵尖了。"',
    '"听您咳了两宿。"——不对，是两声。你说的是两声。',
    '他把袜子穿上，站起来，腰板还是直的："开春都这样。说了。"',
    '话到这儿就关了门。可他往灶上看了一眼："壶里有水。"',
    '壶里有水。你的水缸也是满的。老头的话都在别处。'
  ],
  choices:[{t:'出摊',go:'d6_street'}]
},
'd6_street':{
  text:[
    '十字街，月初，街面上人多。',
    '汇款的多——南边往家寄钱的，一上午排了小队。老纪在柜台里头撕汇款单，一沓。',
    '头一个客户是个包头巾的媳妇，填汇款单。字报得慢，一笔一笔。你写得快。两毛。',
    '她走的时候多看了一眼牌子："明儿还来不？"——"来。"',
    '隔了一会儿又来一个，代写家信，长的，加到一块。收了一块。'
  ],
  choices:[{t:'晌午，回院拿馍',go:'d6_rent'}]
},
'd6_rent':{
  text:[
    '晌午，你回院拿馍。',
    '一进院门——葡萄架底下，咳嗽两声。',
    '不是病咳。是那种拉长了音、冲着院里各屋喊的咳。每个月初一早上你都能听见。听见就知道：该交房钱了。',
    '二十五块。',
    '你摸了摸兜。一块九毛五。',
    '他站在葡萄架底下，没看你这屋，手里弄着他那几根芽。'
  ],
  choices:[
    {t:'站定。开口：月中一并给您',go:'d6_rent_talk',fx:{flag:'rent_talked',mood:1,rel_gao:1}},
    {t:'拿了馍就走。晚上再说',go:'d6_rent_hide',fx:{flag:'rent_hidden',mood:-1}}
  ]
},
'd6_rent_talk':{
  text:[
    '你在葡萄架底下站定。',
    '"高师傅。房租——月中。月中我一并给您。"',
    '他掰着架子上的芽，没回头。',
    '"中。"',
    '就一个字。',
    '你转身要走，他在后头又说："锅里剩粥。你要没吃——"',
    '"吃了。"',
    '"吃了就中。"',
    '压了半晌的事，落地比想象里轻。他没问你钱上哪儿了。这个"中"，比问什么都沉。'
  ],
  choices:[{t:'下午接着出摊',go:'d6_afternoon'}]
},
'd6_rent_hide':{
  text:[
    '你拿了馍就出了院。走得快了点，快得没有必要。',
    '下午摊上来了两拨人。写的什么，你后来没记住。',
    '手上一直有点空。不是没活干的那种空。'
  ],
  choices:[{t:'收摊',go:'d6_evening'}]
},
'd6_afternoon':{
  text:[
    '午后不忙。',
    '来了个二十来岁的后生，在摊前转了两圈，坐下了，脸憋得通红——写给没过门的媳妇。',
    '"你说……咋开头？"',
    '你问了三句：她叫啥、你们咋认识的、你想跟她说啥。他说到第三句，话就多了——她们厂，他攒的钱，他姐不让他现在定。',
    '你听着，笔在纸上记着道道。轮到写，他凑过来看了一眼，脸更红了："这……这是我的话不？"',
    '"是你的。我就记了个道道。"'
  ],
  choices:[
    {t:'念一遍给他听',go:'d6_afternoon_read',fx:{mood:1}},
    {t:'让他自己念',go:'d6_afternoon_self'}
  ]
},
'd6_afternoon_read':{
  text:[
    '你念了一遍。念到"你等信，等到啥时候都中"那句，他低下了头。',
    '两毛。他不还价。走的时候回头看了眼牌子，像记住了什么。'
  ],
  choices:[{t:'傍晚收摊',go:'d6_evening'}]
},
'd6_afternoon_self':{
  text:[
    '他自己念的。磕磕绊绊，念完自己先笑了。',
    '"哥，笔借我用用。我自己改俩字。"',
    '笔还回来的时候，纸上多了俩字。写得歪。但是他的。'
  ],
  choices:[{t:'傍晚收摊',go:'d6_evening'}]
},
'd6_evening':{
  text:[
    '傍晚收摊。',
    '皮三也在收，隔着两步扔过来半句："今儿街面儿，就数汇款的队长。"',
    '顿了顿。"宋大学，你马婶家——"',
    '"这事儿……"他自己刹住了，摆摆手，"没事儿。回吧。"',
    '他不知道马婶家的事。他什么都知道，就是不知道这个。'
  ],
  choices:[{t:'回屋',go:'d6_night'}]
},
'd6_night':{
  text:[
    '夜里。西屋。十五瓦的灯泡，黄。',
    '桌上摊着稿纸——老纪给的那半版报纸裁的，二十四张，还剩十九张。',
    '你知道这摞纸底下压着什么。',
    '腊月里的信。娘的字。六行。',
    '三个月零五天了。',
    '你替别人写了千把封信。自己这几句，你说配不上邮资。'
  ],
  choices:[
    {t:'动笔',go:'d6_letter',fx:{flag:'letter_written'}},
    {t:'把稿纸摞齐，压回去',go:'d6_nolitter',fx:{mood:-1}}
  ]
},
'd6_letter':{
  text:[
    '笔蘸了墨。',
    '第一行——',
    '你和娘之间隔着六行腊月的信，隔了三个月零五天。第一行得先把这层纸捅开，还不能捅疼了。'
  ],
  choices:[
    {t:'"娘。见字如面。"',go:'d6_letter_w',fx:{flag:'letter_formal'}},
    {t:'"娘。天暖了。"',go:'d6_letter_w',fx:{flag:'letter_short'}}
  ]
},
'd6_letter_w':{
  text:[
    '第二行你写：屋里都好。摊子支起来了，在邮局西墙根，牌子自己写的。识字的人打门口过，认得。',
    '写到这里你停了停。',
    '工钱的事。厂里欠的那十六块——写不写？'
  ],
  choices:[
    {t:'写上。轻着写',go:'d6_letter_end',fx:{flag:'letter_money'}},
    {t:'不写。这个不配进这封信',go:'d6_letter_end'}
  ]
},
'd6_letter_end':{
  text:[
    '信不长。两页不到。',
    '落款："儿 有信"。顿了顿，添上日期：一九九五年四月一日。',
    '装进信封，压在墨水瓶底下。',
    '明儿一早去老纪那儿贴邮票。外埠，两毛。',
    '三个月零五天——从今儿晚上起，这个数不用再往上数了。'
  ],
  fx:{mood:2},
  choices:[{t:'记账，睡',go:'d6_end'}]
},
'd6_nolitter':{
  text:[
    '稿纸摞齐了，压回桌角。',
    '灯拉了。黑里头，院里高师傅咳嗽一声——两声里的尾音。',
    '三个月零五天。这个数，明儿还得接着数。'
  ],
  choices:[{t:'睡',go:'d6_end'}]
},
'd6_end':{
  dayend:true,
  text:[
    '记账。'
  ]
},

/* ============ 第7天 · 4月2日 周日 ============ */
'd7_wake':{
  day:DAY7,fx:{health:1},
  text:[
    '四月二号，周日。晴，风比昨天软。',
    '东屋的咳，两声，比昨天松。也可能是你听惯了。',
    '右脸那点木，摸着轻了——快好利索的兆头。',
    '墨水瓶挪在桌角。底下空出来的那块，看着比别处干净。',
    '信在信封里。昨儿夜里就不数了——可你睁眼头一件事，还是算了算日子。',
    '算完才明白：数没停，换了个数法。现在数的是，信到家里得几天。'
  ],
  choices:[{t:'趁早，去邮局',go:'d7_post'}]
},
'd7_post':{
  day:DAY7,
  text:[
    '邮局八点开门，你七点五十到的。',
    '老纪在柜台里拆一封信，郑州的邮戳。看见你，把信扣在算盘底下。',
    '"寄信？"',
    '你把信封放上去。他在手里掂了掂，看了一眼收信地址——乡下。这种地址他一天经手几十个，没说什么。',
    '"外埠。两毛。"',
    '你数给他一张两毛——昨天汇款单上挣的，票面还平。',
    '他撕邮票，推过来浆糊碗：',
    '"封好了？"'
  ],
  choices:[
    {t:'封好了。（贴邮票）',go:'d7_stamp'},
    {t:'稍等——拆开再看一遍',go:'d7_reread'}
  ]
},
'd7_reread':{
  day:DAY7,
  text:[
    '你把信封拿了回来。老纪看着你拆——封口的浆糊没干透，好揭。',
    '两页不到，站着看完的。',
    '看完了，说不上多出什么。写的时候，每个字都是替娘的眼睛写的；这会儿才想起来——娘读信的时候，想的是你腊月走时的那场雪。',
    '看不准的东西，拆一遍也看不准。',
    '重新封上。这回的口，比昨晚的齐。'
  ],
  choices:[{t:'贴邮票',go:'d7_stamp'}]
},
'd7_stamp':{
  day:DAY7,fx:{flag:'letter_sent',mood:1},
  text:[
    '浆糊碗边上结了点皮，筷子搅开。',
    '邮票贴右上角——替别人贴了几百张，都是这个位置。今天这张，抹了三遍才平。',
    '老纪接过去，戳子蘸了印泥：',
    '"外埠，慢五天快三天。"',
    '戳子落下去，跟给谁的都一样。',
    '信进了格子，跟早班的邮件捆在一处。'
  ],
  choices:[{t:'出摊',go:'d7_hand'}]
},
'd7_hand':{
  day:DAY7,
  text:[

/* ================= 引擎 ================= */
const $=id=>document.getElementById(id);
let st=null;

const NEW_GAME={scene:'d6_wake',money:1.95,food:5,health:6,mood:4,
  rel:{gao:3,ma:5,pi:3,ji:4,bai:3,jian:2},flags:{}};

/* ================= 云端存档 ================= */
const REPO='inklotus007/jialiandouhao';
const shaCache={};
let player=null,cloudOn=false,pushTimer=null;

function b64u(b64){const bin=atob(b64.replace(/\n/g,''));const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new TextDecoder().decode(u);}
function b64e(str){const u=new TextEncoder().encode(str);let b='';u.forEach(c=>b+=String.fromCharCode(c));return btoa(b);}
function ghH(){return{'Authorization':'bearer '+localStorage.getItem('jldh_token'),'Accept':'application/vnd.github+json','User-Agent':'jldh-game'};}
function ghPath(p){return 'https://api.github.com/repos/'+REPO+'/contents/'+p.split('/').map(encodeURIComponent).join('/');}

async function ghGet(p){
  const r=await fetch(ghPath(p),{headers:ghH()});
  if(r.status===404)return null;
  if(!r.ok)throw new Error('GET '+r.status);
  const d=await r.json();
  shaCache[p]=d.sha;
  return {data:JSON.parse(b64u(d.content))};
}
async function ghPut(p,obj){
  const body={message:'档：'+p.split('/').pop(),content:b64e(JSON.stringify(obj))};
  if(shaCache[p])body.sha=shaCache[p];
  const opt=()=>({method:'PUT',headers:{...ghH(),'Content-Type':'application/json'},body:JSON.stringify(body)});
  let r=await fetch(ghPath(p),opt());
  if(r.status===422||r.status===409){
    const g=await ghGet(p).catch(()=>null);
    if(g)body.sha=g.sha;else delete body.sha;
    r=await fetch(ghPath(p),opt());
  }
  if(!r.ok)throw new Error('PUT '+r.status);
  const d=await r.json();
  shaCache[p]=d.content.sha;
}

/* ---------- 玩家/档 ---------- */
function localPlayers(){
  const out={};
  for(let i=0;i<localStorage.length;i++){
    const k=localStorage.key(i);
    if(k&&k.indexOf('jldh_save_')===0){
      const name=decodeURIComponent(k.slice(10));
      try{const d=JSON.parse(localStorage.getItem(k));
        out[name]={day:(SCENES[d.scene]&&SCENES[d.scene].day||DAY).num,local:true};}catch(e){}
    }
  }
  return out;
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function fmtTime(iso){
  const m=Math.round((Date.now()-new Date(iso))/60000);
  if(m<1)return'刚刚';if(m<60)return m+'分钟前';
  if(m<1440)return Math.round(m/60)+'小时前';
  return Math.round(m/1440)+'天前';
}

function save(){
  if(!st)return;
  try{localStorage.setItem('jldh_save_'+encodeURIComponent(player),JSON.stringify(st));}catch(e){}
  if(cloudOn){clearTimeout(pushTimer);pushTimer=setTimeout(pushSave,1200);}
}
async function pushSave(){
  if(!st||!player||!cloudOn)return;
  try{
    await ghPut('saves/'+player+'.json',st);
    let g;
    try{g=await ghGet('saves/index.json');}catch(e){g=undefined;} // 网络错不动index，防覆盖别人条目
    if(g===undefined)throw new Error('index读失败');
    const idx=g?g.data:{players:{}};
    idx.players[player]={day:(SCENES[st.scene]&&SCENES[st.scene].day||DAY).num,scene:st.scene,updated:new Date().toISOString()};
    await ghPut('saves/index.json',idx);
    $('cloudDot').textContent='';
  }catch(e){$('cloudDot').textContent='· 云端未同步';}
}

/* ---------- 玩家选择 ---------- */
async function showPicker(){
  $('title').style.display='none';$('game').style.display='none';$('picker').style.display='block';
  window.scrollTo(0,0);
  const L=$('pList');
  L.innerHTML='<div style="text-align:center;color:var(--mut);font-size:13px;padding:8px">翻档中……</div>';
  let players={};
  if(cloudOn){
    try{const g=await ghGet('saves/index.json');players=g?g.data.players:{};}
    catch(e){L.innerHTML='<div style="text-align:center;color:var(--accent);font-size:13px;padding:8px">云端读不上（'+esc(e.message)+'）。<br><a onclick="openCfg()" style="cursor:pointer;text-decoration:underline">检查令牌</a></div>';return;}
  }else{
    players=localPlayers();
  }
  const legacy=!!localStorage.getItem('jldh_save');
  let h='';
  const names=Object.keys(players);
  if(!names.length)h+='<div style="text-align:center;color:var(--mut);font-size:13px;padding:6px">还没有人下笔。</div>';
  names.forEach(n=>{
    const p=players[n];
    h+='<button class="pitem" data-n="'+esc(n)+'" onclick="pick(this.dataset.n)"><div class="pn">'+esc(n)+'</div><div class="pm">第'+p.day+'天'+(p.updated?' · '+fmtTime(p.updated):' · 只存本机')+'</div></button>';
  });
  if(legacy)h+='<button class="pitem" onclick="importLegacy()"><div class="pn">导入本机旧进度</div><div class="pm">检测到升级前的存档，进来认领</div></button>';
  h+='<button class="pitem pnew" onclick="newPlayer()">＋ 新来一位</button>';
  L.innerHTML=h;
}
async function pick(name){
  try{
    if(cloudOn){
      const d=await loadCloudSave(name);
      if(d){st=d;player=name;enterGame();return;}
      alert('云端没找到「'+name+'」的档。');
    }else{
      const s=localStorage.getItem('jldh_save_'+encodeURIComponent(name));
      if(s){st=JSON.parse(s);player=name;enterGame();return;}
      alert('本机没找到「'+name+'」的档。');
    }
  }catch(e){alert('读档失败：'+e.message);}
}
async function loadCloudSave(name){
  const g=await ghGet('saves/'+name+'.json');
  return g?g.data:null;
}
function newPlayer(){
  const name=(prompt('写个名字——谁在写：')||'').trim().replace(/['"\\/]/g,'');
  if(!name)return;
  createPlayer(name,null);
}
async function createPlayer(name,initState){
  if(cloudOn){
    let players={};
    try{const g=await ghGet('saves/index.json');players=g?g.data.players:{};}catch(e){}
    if(players[name]){
      if(confirm('「'+name+'」已有云端档（第'+players[name].day+'天）。接着写？'))pick(name);
      return;
    }
    let init=initState;
    if(!init)init=migrateAsk();
    st=init||JSON.parse(JSON.stringify(NEW_GAME));
    player=name;enterGame();save();
  }else{
    const s=localStorage.getItem('jldh_save_'+encodeURIComponent(name));
    if(s){if(confirm('本机已有「'+name+'」的档。接着写？'))pick(name);return;}
    st=(initState||migrateAsk())||JSON.parse(JSON.stringify(NEW_GAME));
    player=name;save();enterGame();
  }
}
function migrateAsk(){
  const old=localStorage.getItem('jldh_save');
  if(!old)return null;
  try{
    const d=JSON.parse(old);
    const day=(SCENES[d.scene]&&SCENES[d.scene].day||DAY).num;
    if(confirm('发现升级前的旧进度（第'+day+'天）。\n导入为这位玩家的档吗？\n（取消=开新档，旧进度保留）')){
      localStorage.removeItem('jldh_save');
      return d;
    }
  }catch(e){}
  return null;
}
function importLegacy(){
  const old=localStorage.getItem('jldh_save');
  if(!old)return;
  const name=(prompt('这份旧进度是谁写的：')||'').trim().replace(/['"\\/]/g,'');
  if(!name)return;
  let d=null;try{d=JSON.parse(old);}catch(e){}
  createPlayer(name,d).then(()=>{
    if(player===name)localStorage.removeItem('jldh_save');
  });
}
function switchPlayer(){
  if(cloudOn){clearTimeout(pushTimer);pushSave();}
  showPicker();
}
function enterGame(){
  $('picker').style.display='none';$('title').style.display='none';$('game').style.display='block';
  $('gPlayer').textContent=player;
  showScene(st.scene);
}

/* ---------- 设置 ---------- */
function openCfg(){
  $('cmodal').style.display='flex';
  $('tokIn').value=localStorage.getItem('jldh_token')||'';
  $('cfgMsg').textContent='';
}
function closeCfg(){$('cmodal').style.display='none';}
async function saveCfg(){
  const t=$('tokIn').value.trim();
  if(!t){$('cfgMsg').textContent='先把令牌贴进来。';return;}
  localStorage.setItem('jldh_token',t);
  $('cfgMsg').textContent='试连中……';
  try{
    await ghGet('saves/index.json').catch(()=>null); // 404=通（首次没有index）
    cloudOn=true;
    $('cmodal').style.display='none';
    $('cfgbar').style.display='none';
    showPicker();
  }catch(e){
    const m=String(e.message);
    $('cfgMsg').textContent = m.indexOf('401')>-1 ? '令牌无效（401）。检查是否复制全。'
      : m.indexOf('403')>-1 ? '令牌权限不够（403）。需要本仓库 Contents 读写。'
      : '连不上：'+m;
  }
}

function applyFx(fx){
  if(!fx)return;
  if(fx.money)st.money=Math.round((st.money+fx.money)*100)/100;
  if(fx.mood)st.mood=Math.max(0,Math.min(10,st.mood+fx.mood));
  if(fx.food)st.food=Math.max(0,Math.min(10,st.food+fx.food));
  if(fx.health)st.health=Math.max(0,Math.min(10,st.health+fx.health));
  if(fx.rel_gao)st.rel.gao+=fx.rel_gao;
  if(fx.rel_ma)st.rel.ma+=fx.rel_ma;
  if(fx.rel_pi)st.rel.pi+=fx.rel_pi;
  if(fx.rel_ji)st.rel.ji+=fx.rel_ji;
  if(fx.rel_bai)st.rel.bai+=fx.rel_bai;
  if(fx.rel_jian)st.rel.jian+=fx.rel_jian;
  if(fx.flag)st.flags[fx.flag]=true;
}

function showScene(id){
  const sc=SCENES[id];
  if(!sc){$('gText').innerHTML='<p>（这一页还没写。）</p>';$('gChoices').innerHTML='';return;}
  if(sc.fx&&st._fxed!==id){applyFx(sc.fx);st._fxed=id;save();}
  const day=sc.day||DAY;
  $('gDate').innerHTML='<b>'+day.date+'</b> · '+day.week+' · '+day.weather+' · 第'+day.num+'天';
  $('gStat').innerHTML=
    '<span>钱 <b>'+st.money.toFixed(2)+'</b></span>'+
    '<span>食 <b>'+st.food+'</b>/10</span>'+
    '<span>健 <b>'+st.health+'</b>/10</span>'+
    '<span>心 <b>'+st.mood+'</b>/10</span>';
  let html='';
  const lines=typeof sc.text==='function'?sc.text():sc.text;
  lines.forEach(t=>{html+='<p>'+t+'</p>';});
  $('gText').innerHTML=html;

  const ch=$('gChoices');
  ch.innerHTML='';
  if(sc.dayend){ch.innerHTML=dayEndHtml(id);return;}
  const chs=typeof sc.choices==='function'?sc.choices():sc.choices;
  chs.forEach(c=>{
    const b=document.createElement('button');
    b.className='choice';b.textContent=c.t;
    b.onclick=()=>{applyFx(c.fx);st.scene=c.go;save();showScene(st.scene);};
    ch.appendChild(b);
  });
  window.scrollTo(0,0);
}

      ['工钱十六块','□ 王会计说"过阵子"',false],
      ['牙','□ 木见薄，快利索了',false],
      ['账上的洞（第2天）','□ 少收两毛，数记不得了',false],
      ['马婶家的往后','□ 建生今天来取信，空着手。他知道多少？',false],
      ['高师傅的咳','□ 比昨天松——也可能是听惯了',false],
      ['燕子','■ 回来了两只。窝没重筑，蹲在电线上',true]
    ];
  }
  let h='<div class="dayend"><h3>—— '+dayTitle+' ——</h3>';
  if(settleTip)h+='<p class="fx-tip">'+settleTip+'结存 '+st.money.toFixed(2)+'。</p>';
  else h+='<p class="fx-tip">结存 '+st.money.toFixed(2)+'。</p>';
  h+='<h3 style="letter-spacing:2px;font-size:13px">未了事项</h3><ul>';
  items.forEach(it=>{h+='<li class="'+(it[2]?'done':'')+'"><b>'+it[0]+'</b>　'+it[1]+'</li>';});
  h+='</ul>';
  if(id==='d6_end'){
    h+='<div class="next" style="margin-top:14px"><button class="choice" style="width:100%" onclick="nextDay()">睡。进第7天</button></div>';
  }else{
    h+='<div class="next">第8天 · 还没来</div>';
    h+='<p style="margin-top:10px;font-size:12px;color:var(--mut)">（这个摊子慢慢支。内容往后一笔一笔添。）</p>';
    h+='<p style="margin-top:6px;font-size:13px"><a class="fw-link" onclick="FW.open()" style="color:#8a7448;cursor:pointer;text-decoration:underline">电线杆上新贴了一张纸，字歪歪扭扭 →</a></p>';
  }
  return h+'</div>';
}

function nextDay(){
  st.scene=st.flags.letter_written?'d7_wake':'d7_wake_x';

}

<script>
/* ===== 风闻墙：小模型本地生成，不碰存档不碰场景 ===== */
var FW = (function(){
  var loaded = false, loading = false, busy = false, stops = [];
  var prompts = ['兮','天','路','风','他爸说','不知道','是','而','作《','人','门','钱'];
  function ensureLib(cb){
    if(window.MiniGPT){ cb(); return; }
    var s = document.createElement('script');
    s.src = 'minigpt.js';
    s.onload = cb;
    document.head.appendChild(s);
  }
  function load(cb){
    if(loaded){ cb(); return; }
    if(loading){ stops.push(cb); return; }
    loading = true;
    ensureLib(function(){
      fetch('minigpt_weights.json').then(function(r){ return r.json(); }).then(function(j){
        MiniGPT.loadWeights(j);
        loaded = true;
        cb();
        stops.forEach(function(f){ f(); }); stops = [];
      }).catch(function(e){
        loading = false;
        document.getElementById('fwText').innerHTML = '<span class="fw-wait">（纸上的字一时认不出来。'+e.message+'）</span>';
      });
    });
  }
  function gen(){
    if(busy || !loaded) return;
    busy = true;
    var el = document.getElementById('fwText');
    var prompt = prompts[Math.floor(Math.random()*prompts.length)];
    el.innerHTML = '';
    var span = document.createElement('span');
    var cur = document.createElement('span'); cur.className = 'cur';
    el.appendChild(span); el.appendChild(cur);
    MiniGPT.generate(prompt, 110, 0.9, 48, function(ch){
      span.textContent += ch;
      var box = document.getElementById('fwBox');
      box.scrollTop = box.scrollHeight;
    }, function(){
      if(cur.parentNode) cur.remove();
      busy = false;
      document.getElementById('fwAgain').style.visibility = 'visible';
    });
    document.getElementById('fwAgain').style.visibility = 'hidden';
  }
  function open(){
    var m = document.createElement('div');
    m.className = 'fw-mask'; m.id = 'fwMask';
    m.innerHTML = '<div class="fw-box" id="fwBox">'+
      '<div class="fw-title">电 线 杆 上 的 纸</div>'+
      '<div class="fw-text" id="fwText"><span class="fw-wait">（纸被风掀了一下……）</span></div>'+
      '<div class="fw-foot"><span class="fw-wait">梁县字迹 · 本地生成</span>'+
      '<span><a id="fwAgain" onclick="FW.gen()" style="visibility:hidden">再贴一张</a>　<a onclick="FW.close()">收回目光</a></span></div>'+
      '<div class="fw-note">字是一个不识字的东西写的——它只学过「下一个字」。</div></div>';
    document.body.appendChild(m);
    requestAnimationFrame(function(){ m.classList.add('on'); });
    load(function(){ setTimeout(gen, 300); });
  }
  function close(){
    var m = document.getElementById('fwMask');
    if(m) m.remove();
  }
  return { open: open, close: close, gen: gen };
})();
</script>
